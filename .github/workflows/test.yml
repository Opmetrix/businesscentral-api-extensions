name: AL tests and coverage

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Builds the extension and the test app in a BC container, runs the tests and fails on a test failure
      # or when line coverage is below the minimum. See test/README.md.
      - name: Run AL tests with code coverage
        shell: powershell
        run: .\test\Run-Tests.ps1 -MinimumCoverage 100

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: al-test-results
          path: output-tests/
